name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install PDF text extraction prerequisite
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked
      - name: Build browser application
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Build server and exercise the live application
        run: |
          cargo build --locked
          python3 scripts/smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise browser collection and offline recovery
        run: |
          python3 -m pip install -r scripts/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
          python3 scripts/browser_smoke.py
